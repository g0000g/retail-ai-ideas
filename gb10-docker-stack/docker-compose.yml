# =================================================================
# DOCKER COMPOSE CONFIGURATION FOR GB10 AI SERVER
# Stack: vLLM (Qwen2.5/DeepSeek) + PhoWhisper + ComfyUI + Milvus +
#        Spring Boot 4.1.0 (Java 21) + Angular 20 (NGINX)
# =================================================================
version: '3.8'

services:
  # 1. vLLM Core Model Serving Engine (GB10 Blackwell GPU)
  vllm-core:
    image: vllm/vllm-openai:latest
    container_name: gb10-vllm-core
    restart: always
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8000:8000"
    volumes:
      - gb10-models-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen2.5-32B-Instruct
      --tensor-parallel-size 1
      --max-model-len 8192
      --gpu-memory-utilization 0.60
      --trust-remote-code
      --port 8000

  # 2. PhoWhisper ASR Sidecar Service (VinAI PhoWhisper-large int8)
  phowhisper-asr:
    build:
      context: ./phowhisper-sidecar
      dockerfile: Dockerfile
    container_name: gb10-phowhisper-asr
    restart: always
    ports:
      - "8090:8090"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 3. ComfyUI Headless Generative Engine (Virtual Try-On & Digital Human Video)
  comfyui-engine:
    image: yanweiliu/comfyui:latest
    container_name: gb10-comfyui-engine
    restart: always
    ports:
      - "8188:8188"
    volumes:
      - gb10-comfyui-models:/app/ComfyUI/models
      - gb10-comfyui-output:/app/ComfyUI/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python main.py --listen 0.0.0.0 --port 8188

  # 4. Milvus Vector Database Standalone (Product Vector Embeddings)
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: gb10-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: gb10-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data

  milvus-vectordb:
    image: milvusdb/milvus:v2.4.0-standalone
    container_name: gb10-milvus-vectordb
    restart: always
    ports:
      - "19530:19530"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    depends_on:
      - milvus-etcd
      - milvus-minio

  # 5. Backend Spring Boot 4.1.0 Master Application (Java 21)
  backend-spring-boot:
    build:
      context: ./backend-spring-boot
      dockerfile: Dockerfile
    container_name: gb10-backend-springboot4
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_AI_OPENAI_BASE_URL=http://vllm-core:8000
      - PHOWHISPER_ASR_URL=http://phowhisper-asr:8090
      - COMFYUI_URL=http://comfyui-engine:8188
      - MILVUS_HOST=milvus-vectordb
      - MILVUS_PORT=19530
    depends_on:
      - vllm-core
      - phowhisper-asr
      - milvus-vectordb

  # 6. Frontend Angular 20 Web UI (NGINX Web Server)
  frontend-angular20:
    build:
      context: ./frontend-angular20
      dockerfile: Dockerfile
    container_name: gb10-frontend-angular20
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-spring-boot

volumes:
  gb10-models-cache:
  gb10-comfyui-models:
  gb10-comfyui-output:
  milvus-etcd-data:
  milvus-minio-data:
